name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-2022 гарантированно содержит Visual Studio 2022 + C++ workload.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        shell: pwsh
        run: |
          "RUNNER_OS      : $env:RUNNER_OS"
          "RUNNER_ARCH    : $env:RUNNER_ARCH"
          "ImageOS        : $env:ImageOS"
          "ImageVersion   : $env:ImageVersion"
          ""
          cmake --version
          ""
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            "vswhere        : $vswhere"
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            "vswhere        : NOT FOUND (Visual Studio is not installed)"
          }

      - name: Configure (MSVC x64)
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Нужен Windows-раннер, а job выполняется на $env:RUNNER_OS. Проверь runs-on в build.yml."
          }

          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure не прошёл (код $LASTEXITCODE). Смотри лог выше."
          }
          "Configured with Visual Studio 17 2022 generator"

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Сборка не прошла (код $LASTEXITCODE). Смотри лог выше."
          }

      - name: Check result
        shell: pwsh
        run: |
          $exe = "build/Release/StreamPlayer.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem build -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
            throw "StreamPlayer.exe не найден: $exe"
          }
          $f = Get-Item $exe
          "StreamPlayer.exe: {0:N1} MB" -f ($f.Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlayer-x64
          path: build/Release/StreamPlayer.exe
          if-no-files-found: error
