name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-2022 гарантированно содержит Visual Studio 2022 + C++ workload.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        shell: pwsh
        run: |
          "RUNNER_OS      : $env:RUNNER_OS"
          "RUNNER_ARCH    : $env:RUNNER_ARCH"
          "ImageOS        : $env:ImageOS"
          "ImageVersion   : $env:ImageVersion"
          ""
          cmake --version
          ""
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            "vswhere        : $vswhere"
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            "vswhere        : NOT FOUND (Visual Studio is not installed)"
          }

      - name: Configure (MSVC x64)
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Нужен Windows-раннер, а job выполняется на $env:RUNNER_OS. Проверь runs-on в build.yml."
          }

          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -eq 0) {
            "Configured with Visual Studio 17 2022 generator"
            exit 0
          
