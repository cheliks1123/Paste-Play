name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Check artifact
        shell: pwsh
        run: |
          $exe = "build\Release\StreamPlayer.exe"
          if (-not (Test-Path $exe)) { throw "StreamPlayer.exe was not produced" }
          Get-Item $exe | Select-Object FullName, Length
          if ((Get-Item $exe).Length -lt 200000) { throw "exe looks too small, link probably failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlayer-x64
          path: build/Release/StreamPlayer.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamPlayer-x64
          path: dist

      - name: Pack
        run: cd dist && zip -9 ../StreamPlayer-x64.zip StreamPlayer.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: StreamPlayer-x64.zip

