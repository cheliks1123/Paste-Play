<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste &amp; Play</title>
<style>
  :root{
    --bg:#08080b;
    --bg-2:#08080b;
    --panel:#101016;
    --panel-2:#15151d;
    --fg:#f4f4f2;
    --dim:#8d8d97;
    --dim-2:#5d5d68;
    --line:rgba(255,255,255,.10);
    --line-soft:rgba(255,255,255,.06);
    --accent:#8b7cff;
    --accent-2:#6d5cf0;
    --accent-l:#b3a9ff;
    --ar:139,124,255;
    --ok:#73e6b1;
    --err:#ff8f8f;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg-2);min-height:100%}
  body{
    min-height:100vh;color:var(--fg);display:flex;justify-content:center;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding:clamp(14px,3vw,32px) clamp(12px,4vw,36px) 32px;
    background:
      radial-gradient(900px 480px at 10% -10%,rgba(var(--ar),.14),transparent 60%),
      radial-gradient(700px 480px at 100% 10%,rgba(38,174,255,.07),transparent 62%),
      var(--bg-2);
    background-attachment:fixed;
  }
  .shell{width:min(100%,1040px);display:flex;flex-direction:column;gap:18px}

  /* ── иконки ───────────────────────────────── */
  svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ── общие кнопки ─────────────────────────── */
  .ib{
    flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;
    border:1px solid transparent;background:none;color:var(--dim);cursor:pointer;font:inherit;
    transition:color .16s,background .16s,transform .16s,border-color .16s,box-shadow .16s;
  }
  .ib:hover{color:var(--fg);background:rgba(255,255,255,.07)}
  .ib:active{transform:scale(.93)}
  .ib:focus-visible{outline:2px solid rgba(var(--ar),.7);outline-offset:2px}
  .ib.go{
    color:#fff;background:linear-gradient(135deg,var(--accent-l),var(--accent-2));
    box-shadow:0 8px 22px rgba(var(--ar),.28);
  }
  .ib.go:hover{background:linear-gradient(135deg,var(--accent-l),var(--accent-2));box-shadow:0 10px 28px rgba(var(--ar),.4);transform:translateY(-1px)}
  .ib.sm{width:34px;height:34px;border-radius:10px}
  .ib.sm svg.i{width:18px;height:18px}
  .ib.on{color:var(--accent);background:rgba(var(--ar),.14)}

  /* ── верхняя панель ───────────────────────── */
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 8px 8px 12px;border:1px solid var(--line-soft);border-radius:18px;
    background:rgba(14,14,20,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  }
  .brand-mark{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent-l),var(--accent-2));box-shadow:0 7px 22px rgba(var(--ar),.3);
  }
  .brand-mark svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand-mark svg .f{fill:#fff;stroke:none}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.02em}
  .brand b{font-weight:inherit;background:linear-gradient(90deg,#fff,var(--accent-l));-webkit-background-clip:text;background-clip:text;color:transparent}
  @media(max-width:480px){.brand b{display:none}}
  .tabs{display:flex;gap:4px;padding:3px;border-radius:14px;background:rgba(255,255,255,.04)}
  .tab{position:relative;width:48px;height:36px;border-radius:11px}
  .tab.active{color:#fff;background:rgba(255,255,255,.1);box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .tab .count{
    position:absolute;top:2px;right:4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
    background:var(--accent);color:#fff;font-size:9.5px;font-weight:600;line-height:15px;text-align:center;
  }
  .tab .count:empty{display:none}
  .top .sp{width:32px}

  .tab-panel{display:none}
  .tab-panel.active{display:flex;flex-direction:column;gap:16px;animation:panel-in .4s cubic-bezier(.2,.72,.25,1) both}
  @keyframes panel-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ── строка ссылки ────────────────────────── */
  .form{position:relative}
  .bar{
    display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;
    background:linear-gradient(135deg,rgba(22,22,31,.95),rgba(14,14,20,.95));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 18px 45px rgba(0,0,0,.22);
    transition:border-color .2s,box-shadow .2s;
  }
  .bar:focus-within{border-color:rgba(var(--ar),.55);box-shadow:0 0 0 4px rgba(var(--ar),.08),0 22px 60px rgba(0,0,0,.28)}
  .bar.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .bar > svg.i{color:var(--dim-2);margin-right:6px;transition:color .2s}
  .bar:focus-within > svg.i{color:var(--accent-l)}
  .bar input{
    flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);
    font:inherit;font-size:15px;padding:12px 2px;
  }
  .bar input::placeholder{color:var(--dim-2)}
  #clearurl{display:none}
  .bar.has-text #clearurl{display:inline-grid}
  .msg{
    position:absolute;left:18px;top:calc(100% + 6px);font-size:12px;color:var(--err);
    opacity:0;transform:translateY(-3px);transition:.2s;pointer-events:none;
  }
  .msg.show{opacity:1;transform:none}

  /* ── заголовок плеера ─────────────────────── */
  .head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;min-height:44px}
  .head .title{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head .badge{
    flex:none;display:none;align-items:center;gap:6px;font-size:11px;letter-spacing:.05em;color:var(--dim);
    border:1px solid var(--line-soft);border-radius:20px;padding:3px 10px;
  }
  .head .badge i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.45;transform:scale(.72)}}
  .head .acts{display:none;gap:2px}
  .head.has .badge{display:inline-flex}
  .head.has .acts{display:flex}
  .head.local #h-copy,.head.local #h-open{display:none}
  .head.has + .player{margin-top:0}
  /* пустая шапка скрыта целиком */
  .head:not(.has){display:none}

  /* ── плеер ────────────────────────────────── */
  .player{
    position:relative;width:100%;aspect-ratio:16/9;background:#050507;
    border-radius:20px;overflow:hidden;user-select:none;outline:none;
    border:1px solid var(--line-soft);
    box-shadow:0 34px 90px -35px rgba(0,0,0,.9);
  }
  .player:fullscreen{border-radius:0;border:0;width:100vw;height:100vh;aspect-ratio:auto}
  .player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
  .player.mode-file video{display:block}
  .player.mode-embed iframe{display:block}
  .player.mode-file,.player.mode-embed{animation:player-open .5s cubic-bezier(.18,.75,.25,1)}
  @keyframes player-open{from{opacity:.35;transform:scale(.98);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

  /* пустое состояние: только иконки */
  .player > .empty{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:18px;overflow:hidden;
    background:radial-gradient(80% 100% at 50% 15%,#171522 0%,#09090d 70%);
  }
  .player.mode-empty > .empty{display:flex}
  .player > .empty::before,.player > .empty::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
  .player > .empty::before{width:380px;height:380px;border:1px solid rgba(var(--ar),.09);animation:orbit 14s linear infinite}
  .player > .empty::after{width:230px;height:230px;border:1px dashed rgba(84,214,255,.08);animation:orbit 18s linear infinite reverse}
  @keyframes orbit{to{transform:rotate(360deg)}}
  .big-ib{
    position:relative;z-index:1;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;cursor:pointer;
    color:var(--accent-l);background:rgba(255,255,255,.045);border:1px solid var(--line);
    transition:transform .2s,background .2s,color .2s,box-shadow .2s;
  }
  .big-ib svg.i{width:28px;height:28px}
  .big-ib:hover{transform:translateY(-3px);background:rgba(var(--ar),.16);color:#fff;box-shadow:0 14px 40px rgba(var(--ar),.25)}
  .big-ib:active{transform:scale(.95)}
  .big-ib:focus-visible{outline:2px solid rgba(var(--ar),.7);outline-offset:3px}

  /* встроенный сервис: только полный экран */
  .embed-fs{
    position:absolute;top:12px;right:12px;z-index:3;display:none;opacity:0;
    background:rgba(10,10,14,.6);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .player.mode-embed .embed-fs{display:inline-grid}
  .player.mode-embed:hover .embed-fs,.embed-fs:focus-visible{opacity:1}

  /* ── управление (режим файла) ─────────────── */
  .center{
    position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);background:rgba(26,22,43,.5);color:#fff;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.3);
    display:none;place-items:center;cursor:pointer;z-index:2;transition:opacity .3s,transform .3s,background .2s;
  }
  .center svg.i{width:26px;height:26px;margin-left:3px}
  .player.mode-file .center{display:grid}
  .center:hover{background:rgba(255,255,255,.16);transform:scale(1.05)}
  .player.playing .center{opacity:0;pointer-events:none;transform:scale(1.3)}

  .shade{
    position:absolute;left:0;right:0;bottom:0;height:160px;pointer-events:none;display:none;
    background:linear-gradient(to top,rgba(0,0,0,.75),transparent);transition:opacity .35s;
  }
  .controls{position:absolute;left:0;right:0;bottom:0;padding:0 16px 10px;display:none;transition:opacity .35s,transform .35s;z-index:2}
  .player.mode-file .shade,.player.mode-file .controls{display:block}
  .player.idle.playing .controls,.player.idle.playing .shade{opacity:0}
  .player.idle.playing .controls{transform:translateY(6px)}
  .player.idle.playing{cursor:none}

  .track-bar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .track{position:relative;width:100%;height:3px;background:rgba(255,255,255,.22);border-radius:3px;transition:height .15s}
  .track-bar:hover .track,.track-bar.drag .track{height:5px}
  .buffer,.fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit}
  .buffer{background:rgba(255,255,255,.26);width:0}
  .fill{background:linear-gradient(90deg,var(--accent-l),#fff);width:0}
  .knob{
    position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%) scale(0);transition:transform .15s;box-shadow:0 0 0 4px rgba(var(--ar),.3)
  }
  .track-bar:hover .knob,.track-bar.drag .knob{transform:translate(-50%,-50%) scale(1)}
  .tip{
    position:absolute;bottom:26px;left:0;transform:translateX(-50%);font-size:11px;font-variant-numeric:tabular-nums;
    padding:3px 7px;border-radius:6px;background:rgba(10,10,10,.85);opacity:0;pointer-events:none;transition:opacity .15s
  }
  .track-bar:hover .tip,.track-bar.drag .tip{opacity:1}

  .row{display:flex;align-items:center;gap:2px}
  .sp{flex:1}
  .row .ib{color:#fff;opacity:.85;width:38px;height:38px;border-radius:50%}
  .row .ib:hover{opacity:1;background:rgba(255,255,255,.14)}
  .row .ib.on{color:var(--accent-l);opacity:1;background:rgba(var(--ar),.22)}
  .row .ib.speed{width:auto;min-width:42px;padding:0 10px;border-radius:19px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
  .time{font-size:12px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.88);margin:0 10px;white-space:nowrap}
  .time i{font-style:normal;opacity:.45;margin:0 3px}

  .vol{display:flex;align-items:center}
  .vslider{width:0;overflow:hidden;transition:width .25s,margin .25s;display:flex;align-items:center;height:38px}
  .vol:hover .vslider,.vol:focus-within .vslider{width:72px;margin:0 8px 0 2px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:72px;height:3px;border-radius:3px;outline:0;cursor:pointer;
    background:linear-gradient(to right,#fff var(--v,100%),rgba(255,255,255,.25) var(--v,100%));
  }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;border:0}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:0}

  .spinner{
    position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;display:none;
    border:2px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .8s linear infinite;z-index:2
  }
  .player.wait.mode-file .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{
    position:absolute;top:16px;left:50%;transform:translate(-50%,-6px);font-size:12px;padding:6px 12px;border-radius:20px;
    background:rgba(10,10,14,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;transition:.22s;pointer-events:none;z-index:4;white-space:nowrap
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .drop{
    position:absolute;inset:10px;border:1.5px dashed rgba(255,255,255,.5);border-radius:14px;display:none;
    place-items:center;background:rgba(0,0,0,.7);color:rgba(255,255,255,.9);z-index:5
  }
  .drop svg.i{width:44px;height:44px;stroke-width:1.3}
  .player.over .drop{display:grid}

  /* ── история ──────────────────────────────── */
  .lib{padding:10px;border:1px solid var(--line-soft);border-radius:18px;background:rgba(16,16,23,.72);backdrop-filter:blur(14px)}
  .lib-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px 10px;color:var(--dim)}
  .lib-head .ib{width:36px;height:36px}
  .lib-head .ib:hover{color:var(--err);background:rgba(255,143,143,.1)}
  .list{list-style:none;display:flex;flex-direction:column}
  .list li{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s;animation:list-in .35s both;animation-delay:calc(var(--i,0)*40ms)}
  @keyframes list-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .list li:hover{background:rgba(255,255,255,.05)}
  .list li + li{border-top:1px solid var(--line-soft)}
  .list li.none{cursor:default;justify-content:center;padding:44px 0;color:var(--dim-2);animation:none}
  .list li.none:hover{background:none}
  .list li.none svg.i{width:38px;height:38px;stroke-width:1.2}
  .mono{
    flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(var(--ar),.16),rgba(84,214,255,.07));border:1px solid var(--line-soft);
    font-size:12px;font-weight:600;color:var(--accent-l);text-transform:uppercase
  }
  .info{min-width:0;flex:1}
  .info b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .info span{display:block;font-size:11.5px;color:var(--dim-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .list .del{opacity:0;width:32px;height:32px}
  .list li:hover .del,.list .del:focus-visible{opacity:1}
  .list .del svg.i{width:16px;height:16px}
  @media (hover:none){.list .del{opacity:.7}}

  /* ── сервисы ──────────────────────────────── */
  .service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .service{
    position:relative;overflow:hidden;min-height:110px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;
    border:1px solid var(--line-soft);border-radius:18px;background:rgba(255,255,255,.025);
    color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:.25s;
  }
  .service::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-50px;bottom:-55px;background:var(--c,#8b7cff);filter:blur(30px);opacity:.14;transition:.3s}
  .service:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.045)}
  .service:hover::after{opacity:.32;transform:scale(1.4)}
  .service:focus-visible{outline:2px solid rgba(var(--ar),.7);outline-offset:2px}
  .service-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:11.5px;font-weight:600;color:var(--c)}
  .service-icon svg.i{width:18px;height:18px;color:var(--c)}
  .service b{font-size:13.5px;font-weight:500;position:relative;z-index:1}


  /* ── настройки ────────────────────────────── */
  .set{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line-soft);border-radius:18px;background:rgba(16,16,23,.72);backdrop-filter:blur(14px)}
  .set-row{display:flex;align-items:center;gap:14px;padding:12px 10px;flex-wrap:wrap}
  .set-row + .set-row{border-top:1px solid var(--line-soft)}
  .set-row > svg.i{color:var(--dim);width:22px;height:22px}
  .sw-list{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1}
  .sw{
    width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,box-shadow .15s;padding:0;
  }
  .sw:hover{transform:scale(1.12)}
  .sw.sel{border-color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.45),0 0 18px -2px var(--c)}
  .sw:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .sw.bgsw{border-radius:11px;border:1.5px solid var(--line)}
  .sw.bgsw.sel{border-color:#fff}
  .custom{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;cursor:pointer;
    background:conic-gradient(#ff5a5a,#ffd24d,#4ade80,#2dd4bf,#4da3ff,#8b7cff,#ff6b9d,#ff5a5a);border:2px solid transparent;transition:transform .15s}
  .custom:hover{transform:scale(1.12)}
  .custom.sel{border-color:#fff}
  .custom input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer}

  @media(max-width:760px){.service-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.vol,.pip{display:none}.controls{padding:0 8px 6px}.center{width:62px;height:62px}.time{margin:0 6px}.row .ib{width:36px;height:36px}.big-ib{width:58px;height:58px;border-radius:19px}}
  @media(max-width:420px){#back10,#fwd10{display:none}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<!-- иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2.5-2.5a5 5 0 0 0-7-7L11 5"/><path d="M14 11a5 5 0 0 0-7 0L4.5 13.5a5 5 0 0 0 7 7L13 19"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1.2"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-go" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.5v15a.8.8 0 0 0 1.2.7l12.4-7.5a.8.8 0 0 0 0-1.4L8.2 3.8A.8.8 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" stroke="none" x="6" y="4.5" width="3.8" height="15" rx="1"/><rect fill="currentColor" stroke="none" x="14.2" y="4.5" width="3.8" height="15" rx="1"/></symbol>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const player = $('player'), video = $('video'), shell = document.querySelector('.shell');
  const fill = $('fill'), buf = $('buf'), knob = $('knob'), trackbar = $('trackbar'), tip = $('tip');
  const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];

  let mode = 'empty';           // empty | file | embed
  let frame = null;             // iframe для встраиваемых сервисов
  let hls = null;
  let current = null;           // {url,title,provider,kind,original}
  let toastTimer;

  /* ── утилиты ───────────────────────────── */
  const fmt = s => {
    if (!isFinite(s) || s < 0) return '0:00';
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  };
  const toast = t => {
    const e = $('toast'); e.textContent = t; e.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('show'), 1400);
  };
  let errTimer;
  const err = t => {
    const e = $('msg'); e.textContent = t; e.classList.add('show');
    const b = $('barwrap'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    clearTimeout(errTimer); errTimer = setTimeout(clearErr, 3500);
  };
  const clearErr = () => $('msg').classList.remove('show');
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };

  /* ── хранилище (безопасно в sandbox) ───── */
  const store = {
    get(k, d) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  /* ── распознавание ссылки ──────────────── */
  const FILE_EXT = ['mp4', 'webm', 'ogg', 'ogv', 'm4v', 'mov', 'mkv', 'm3u8', 'mpd'];

  function normalize(raw) {
    let s = (raw || '').trim();
    if (!s) return null;
    if (/^\/\//.test(s)) s = 'https:' + s;
    else if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
    try { return new URL(s); } catch { return null; }
  }

  function detect(raw) {
    const u = normalize(raw);
    if (!u) return { kind: 'error', msg: 'Это не ссылка' };

    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    const path = u.pathname;

    // прямой файл
    const ext = (path.match(/\.([a-z0-9]{2,5})$/i) || [])[1];
    if (ext && FILE_EXT.includes(ext.toLowerCase())) {
      const name = decodeURIComponent(path.split('/').filter(Boolean).pop() || host);
      return { kind: 'file', src: u.href, title: name, provider: extFrom(name) };
    }

    // YouTube
    if (/^(youtube\.com|youtu\.be|youtube-nocookie\.com|m\.youtube\.com)$/.test(host)) {
      let id = '';
      if (host === 'youtu.be') id = path.split('/')[1] || '';
      else if (/^\/watch/.test(path)) id = u.searchParams.get('v') || '';
      else { const m = path.match(/^\/(shorts|embed|live|v)\/([\w-]{6,})/); if (m) id = m[2]; }
      if (id) return {
        kind: 'embed', provider: 'YouTube', title: 'YouTube · ' + id,
        src: 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1',
        original: u.href
      };
    }

    // Vimeo
    if (/(^|\.)vimeo\.com$/.test(host)) {
      const m = path.match(/(\d{5,})/);
      if (m) return {
        kind: 'embed', provider: 'Vimeo', title: 'Vimeo · ' + m[1],
        src: 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1',
        original: u.href
      };
    }

    // Rutube
    if (/(^|\.)rutube\.ru$/.test(host)) {
      const m = path.match(/\/(?:video|play\/embed)\/([a-f0-9]{16,})/i);
      if (m) return {
        kind: 'embed', provider: 'Rutube', title: 'Rutube · ' + m[1].slice(0, 8),
        src: 'https://rutube.ru/play/embed/' + m[1],
        original: u.href
      };
    }

    // VK Video
    if (/(^|\.)(vk\.com|vkvideo\.ru|vk\.ru)$/.test(host)) {
      const m = path.match(/video(-?\d+)_(\d+)/);
      if (m) {
        const hash = u.searchParams.get('hash');
        let src = 'https://vk.com/video_ext.php?oid=' + m[1] + '&id=' + m[2] + '&hd=2';
        if (hash) src += '&hash=' + encodeURIComponent(hash);
        return {
          kind: 'embed', provider: 'VK Video', title: 'VK · ' + m[1] + '_' + m[2], src, original: u.href
        };
      }
    }

    // Dailymotion
    if (/(^|\.)dailymotion\.com$/.test(host) || host === 'dai.ly') {
      const m = path.match(/\/(?:video|hub)\/([a-z0-9]{5,})/i) || path.match(/^\/([a-z0-9]{5,})/i);
      if (m) return {
        kind: 'embed', provider: 'Dailymotion', title: 'Dailymotion · ' + m[1],
        src: 'https://www.dailymotion.com/embed/video/' + m[1] + '?autoplay=1',
        original: u.href
      };
    }

    // Twitch
    if (/(^|\.)twitch\.tv$/.test(host)) {
      const parent = location.hostname || 'localhost';
      const vod = path.match(/\/videos\/(\d+)/);
      const chan = !vod && path.split('/')[1];
      if (vod) return {
        kind: 'embed', provider: 'Twitch', title: 'Twitch · видео ' + vod[1],
        src: 'https://player.twitch.tv/?video=' + vod[1] + '&parent=' + parent + '&autoplay=true',
        original: u.href
      };
      if (chan) return {
        kind: 'embed', provider: 'Twitch', title: 'Twitch · ' + chan,
        src: 'https://player.twitch.tv/?channel=' + encodeURIComponent(chan) + '&parent=' + parent + '&autoplay=true',
        original: u.href
      };
    }

    // OK.ru
    if (/(^|\.)ok\.ru$/.test(host)) {
      const m = path.match(/\/video\/(\d+)/);
      if (m) return {
        kind: 'embed', provider: 'OK', title: 'OK · ' + m[1],
        src: 'https://ok.ru/videoembed/' + m[1], original: u.href
      };
    }

    // похоже на страницу с видео, но не поддержано
    return {
      kind: 'error',
      msg: 'Сервис не поддерживается'
    };
  }
  const extFrom = n => (n.match(/\.([a-z0-9]{2,5})$/i) || [, 'файл'])[1].toUpperCase();


  /* ── смена режима ──────────────────────── */
  function setMode(m) {
    mode = m;
    player.classList.remove('mode-empty', 'mode-file', 'mode-embed');
    player.classList.add('mode-' + m);
    player.classList.remove('idle');
  }
  function setHead(title, provider, show, local) {
    const h = $('head');
    $('title').textContent = title || '';
    $('badge-text').textContent = provider || '';
    h.classList.toggle('has', !!show);
    h.classList.toggle('local', !!local);
  }
  function teardown() {
    if (hls) { try { hls.destroy(); } catch {} hls = null; }
    if (frame) { frame.remove(); frame = null; }
    video.pause();
    video.removeAttribute('src');
    try { video.load(); } catch {}
    player.classList.remove('playing', 'wait');
    syncPlay();
  }
  function closeVideo() {
    teardown();
    setMode('empty');
    setHead('', '', false);
    current = null;
    video.loop = false; $('loop').classList.remove('on');
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  }

  /* ── воспроизведение файла ─────────────── */
  function playFile(src, { title, provider, local } = {}) {
    teardown();
    setMode('file');
    setHead(title || 'Видео', provider || 'файл', true, local);
    player.classList.add('wait');

    if (local) video.removeAttribute('poster');
    else video.setAttribute('poster', 'media/poster.jpg');

    const isHls = /\.m3u8($|\?)/i.test(src);
    if (isHls && !video.canPlayType('application/vnd.apple.mpegurl')) {
      withHls(src);
    } else {
      video.src = src;
    }
    video.play().catch(() => { player.classList.remove('wait'); });
  }

  function withHls(src) {
    const boot = () => {
      if (window.Hls && window.Hls.isSupported()) {
        hls = new window.Hls({ enableWorker: true });
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(window.Hls.Events.ERROR, (_, d) => {
          if (d.fatal) { player.classList.remove('wait'); toast('Поток не открылся'); }
        });
      } else {
        video.src = src;   // нативный HLS (Safari)
      }
    };
    if (window.Hls) return boot();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
    s.onload = boot;
    s.onerror = () => { video.src = src; };
    document.head.appendChild(s);
  }

  /* ── воспроизведение через встраивание ─── */
  function playEmbed(res) {
    teardown();
    setMode('embed');
    setHead(res.title, res.provider, true);

    frame = document.createElement('iframe');
    frame.src = res.src;
    frame.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
    frame.allowFullscreen = true;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.title = res.title || res.provider;
    player.appendChild(frame);
  }

  /* ── главный загрузчик ─────────────────── */
  function open(raw, { remember = true, silent = false } = {}) {
    clearErr();
    if (!raw || !raw.trim()) { err('Вставьте ссылку'); $('url').focus(); return; }
    const res = detect(raw);

    if (res.kind === 'error') { err(res.msg); if (!silent) toast('Не получилось открыть'); return; }

    setUrl(raw.trim());
    current = { url: raw.trim(), kind: res.kind, title: res.title, provider: res.provider, original: res.original || res.src };

    if (res.kind === 'file') playFile(res.src, { title: res.title, provider: res.provider });
    else playEmbed(res);

    if (remember) pushRecent(current);
    try { history.replaceState(null, '', '#v=' + encodeURIComponent(raw.trim())); } catch {}
  }

  /* ── недавние ──────────────────────────── */
  let recent = store.get('player.recent', []);

  function pushRecent(item) {
    recent = recent.filter(r => r.url !== item.url);
    recent.unshift({ url: item.url, title: item.title, provider: item.provider, kind: item.kind });
    recent = recent.slice(0, 8);
    store.set('player.recent', recent);
    renderRecent();
  }

  const SVG = n => '<svg class="i"><use href="#i-' + n + '"/></svg>';

  function renderRecent() {
    const list = $('list');
    list.innerHTML = '';
    $('count').textContent = recent.length || '';
    $('clear').style.visibility = recent.length ? '' : 'hidden';
    if (!recent.length) {
      const li = document.createElement('li');
      li.className = 'none';
      li.innerHTML = SVG('clock');
      list.appendChild(li);
      return;
    }
    recent.forEach((r, i) => {
      const li = document.createElement('li');
      const mono = document.createElement('div');
      mono.className = 'mono';
      mono.textContent = (r.provider || r.kind || '?')[0];
      const info = document.createElement('div');
      info.className = 'info';
      const b = document.createElement('b'); b.textContent = r.title || r.url;
      const s = document.createElement('span'); s.textContent = hostOf(r.url) || r.url;
      info.append(b, s);
      const del = document.createElement('button');
      del.className = 'ib del'; del.type = 'button'; del.title = 'Убрать'; del.setAttribute('aria-label', 'Убрать');
      del.innerHTML = SVG('x');
      del.onclick = e => {
        e.stopPropagation();
        recent.splice(i, 1);
        store.set('player.recent', recent);
        renderRecent();
      };
      li.append(mono, info, del);
      li.style.setProperty('--i', i);
      li.onclick = () => { switchTab('watch'); setTimeout(() => open(r.url, { remember: false }), 80); };
      list.appendChild(li);
    });
  }

  /* ── строка ссылки ─────────────────────── */
  const urlEl = $('url'), bar = $('barwrap');
  const syncBar = () => bar.classList.toggle('has-text', !!urlEl.value);
  const setUrl = v => { urlEl.value = v; syncBar(); };

  $('form').addEventListener('submit', e => { e.preventDefault(); open(urlEl.value); });
  urlEl.addEventListener('input', () => { clearErr(); syncBar(); });
  urlEl.addEventListener('paste', () => {
    setTimeout(() => {
      syncBar();
      const v = urlEl.value.trim();
      if (v && detect(v).kind !== 'error') open(v);   // вставил → уже играет
    }, 30);
  });
  $('clearurl').onclick = () => { setUrl(''); clearErr(); urlEl.focus(); };
  $('paste').onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) { setUrl(text); open(text); }
      else { urlEl.focus(); err('Буфер пуст'); }
    } catch {
      urlEl.focus();
      toast('Ctrl+V');
    }
  };

  /* ── кнопки шапки плеера ───────────────── */
  $('h-copy').onclick = async () => {
    const t = current && current.url; if (!t) return;
    try { await navigator.clipboard.writeText(t); }
    catch {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
    }
    toast('Скопировано');
  };
  $('h-open').onclick = () => { if (current && current.original) window.open(current.original, '_blank', 'noopener'); };
  $('h-close').onclick = closeVideo;

  $('demo').onclick = () => open('media/demo.mp4');
  $('pick').onclick = () => $('file').click();
  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) loadLocal(f);
    e.target.value = '';
  });
  function loadLocal(f) {
    if (!f.type.startsWith('video/')) { err('Это не видео'); return; }
    const url = URL.createObjectURL(f);
    teardown();
    setMode('file');
    setHead(f.name, 'файл', true, true);
    current = { kind: 'file' };
    video.removeAttribute('poster');
    video.src = url;
    video.play().catch(() => {});
    try { history.replaceState(null, '', location.pathname); } catch {}
  }

  $('clear').onclick = () => { recent = []; store.set('player.recent', recent); renderRecent(); };

  /* drag & drop */
  ['dragenter', 'dragover'].forEach(n => shell.addEventListener(n, e => { e.preventDefault(); switchTab('watch'); player.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => shell.addEventListener(n, e => { e.preventDefault(); if (n === 'drop' || e.target === shell) player.classList.remove('over'); }));
  shell.addEventListener('drop', e => {
    player.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) return loadLocal(f);
    const t = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list');
    if (t) open(t);
  });

  /* ===== управление видео (режим file) ===== */
  const syncPlay = () => {
    const paused = video.paused;
    player.classList.toggle('playing', !paused);
    $('ico-play').style.display = paused ? '' : 'none';
    $('ico-pause').style.display = paused ? 'none' : '';
  };
  const toggle = () => { if (mode !== 'file') return; video.paused ? video.play().catch(() => {}) : video.pause(); };
  const seekBy = d => {
    if (mode !== 'file' || !video.duration) return;
    video.currentTime = Math.min(video.duration, Math.max(0, video.currentTime + d));
    toast((d > 0 ? '+' : '−') + Math.abs(d));
  };

  video.addEventListener('play', syncPlay);
  video.addEventListener('pause', syncPlay);
  video.addEventListener('ended', () => { player.classList.remove('idle'); syncPlay(); });
  video.addEventListener('click', toggle);
  video.addEventListener('dblclick', toggleFs);
  $('play').onclick = toggle;
  $('big').onclick = toggle;
  $('back10').onclick = () => seekBy(-10);
  $('fwd10').onclick = () => seekBy(10);
  $('loop').onclick = () => { video.loop = !video.loop; $('loop').classList.toggle('on', video.loop); toast(video.loop ? '↻ вкл' : '↻ выкл'); };

  const upd = () => {
    const d = video.duration || 0, pct = d ? video.currentTime / d * 100 : 0;
    fill.style.width = pct + '%'; knob.style.left = pct + '%';
    $('cur').textContent = fmt(video.currentTime);
  };
  video.addEventListener('timeupdate', upd);
  video.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(video.duration); upd(); });
  video.addEventListener('durationchange', () => { $('dur').textContent = fmt(video.duration); });
  video.addEventListener('progress', () => {
    if (video.buffered.length && video.duration)
      buf.style.width = video.buffered.end(video.buffered.length - 1) / video.duration * 100 + '%';
  });
  video.addEventListener('waiting', () => player.classList.add('wait'));
  ['playing', 'canplay', 'seeked'].forEach(ev => video.addEventListener(ev, () => player.classList.remove('wait')));
  video.addEventListener('error', () => { player.classList.remove('wait'); if (mode === 'file' && video.currentSrc) toast('Формат не открылся'); });

  /* прогресс-бар */
  const ratio = e => { const r = trackbar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const hover = e => {
    const r = ratio(e), w = trackbar.clientWidth;
    tip.style.left = Math.min(w - 24, Math.max(24, r * w)) + 'px';
    tip.textContent = fmt(r * (video.duration || 0));
  };
  let dragging = false, wasPlaying = false;
  trackbar.addEventListener('pointerdown', e => {
    if (mode !== 'file' || !video.duration) return;
    dragging = true; wasPlaying = !video.paused; video.pause();
    trackbar.setPointerCapture(e.pointerId); trackbar.classList.add('drag');
    video.currentTime = ratio(e) * video.duration; hover(e); upd();
  });
  trackbar.addEventListener('pointermove', e => {
    hover(e);
    if (dragging) { video.currentTime = ratio(e) * video.duration; upd(); }
  });
  const endDrag = () => { if (!dragging) return; dragging = false; trackbar.classList.remove('drag'); if (wasPlaying) video.play().catch(() => {}); };
  trackbar.addEventListener('pointerup', endDrag);
  trackbar.addEventListener('pointercancel', endDrag);

  /* звук */
  const vol = $('vol');
  const volUI = () => {
    const val = video.muted ? 0 : video.volume;
    vol.value = val; vol.style.setProperty('--v', val * 100 + '%');
    $('x').style.display = val === 0 ? '' : 'none';
    $('w1').style.display = val > 0 ? '' : 'none';
    $('w2').style.display = val > .5 ? '' : 'none';
  };
  vol.addEventListener('input', () => { video.volume = +vol.value; video.muted = video.volume === 0; });
  video.addEventListener('volumechange', volUI);
  $('mute').onclick = () => {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) video.volume = .5;
  };
  volUI();

  /* скорость */
  const setSpeed = r => { video.playbackRate = r; $('speed').textContent = r + '×'; toast(r + '×'); };
  $('speed').onclick = () => {
    const i = (SPEEDS.indexOf(video.playbackRate) + 1) % SPEEDS.length;
    setSpeed(SPEEDS[i]);
  };

  /* PiP / fullscreen */
  const pipBtn = $('pip');
  if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';
  const togglePip = async () => {
    if (mode !== 'file') return;
    try {
      document.pictureInPictureElement ? await document.exitPictureInPicture() : await video.requestPictureInPicture();
    } catch { toast('PiP ✕'); }
  };
  pipBtn.onclick = togglePip;

  async function toggleFs() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await player.requestFullscreen();
    } catch { toast('✕'); }
  }
  $('fs').onclick = toggleFs;
  $('embed-fs').onclick = toggleFs;

  /* скрытие управления */
  let idleTimer;
  const wake = () => {
    player.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!dragging) player.classList.add('idle'); }, 2200);
  };
  ['mousemove', 'pointerdown', 'touchstart'].forEach(ev => player.addEventListener(ev, wake));
  player.addEventListener('mouseleave', () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => player.classList.add('idle'), 600);
  });

  /* клавиатура */
  const FORM = /^(INPUT|TEXTAREA)$/;
  document.addEventListener('keydown', e => {
    if (FORM.test(e.target.tagName)) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (mode !== 'file') return;

    const k = e.key.toLowerCase();
    let used = true;
    if (k === ' ' || k === 'k') toggle();
    else if (k === 'arrowright') seekBy(5);
    else if (k === 'arrowleft') seekBy(-5);
    else if (k === 'l') seekBy(10);
    else if (k === 'j') seekBy(-10);
    else if (k === 'arrowup') { video.muted = false; video.volume = Math.min(1, video.volume + .05); toast(Math.round(video.volume * 100) + '%'); }
    else if (k === 'arrowdown') { video.volume = Math.max(0, video.volume - .05); toast(Math.round(video.volume * 100) + '%'); }
    else if (k === 'm') $('mute').click();
    else if (k === 'f') toggleFs();
    else if (k === 'p') togglePip();
    else if (k === '.' || k === '>') setSpeed(SPEEDS[Math.min(SPEEDS.length - 1, SPEEDS.indexOf(video.playbackRate) + 1)]);
    else if (k === ',' || k === '<') setSpeed(SPEEDS[Math.max(0, SPEEDS.indexOf(video.playbackRate) - 1)]);
    else if (/^[0-9]$/.test(k) && video.duration) video.currentTime = video.duration * (+k / 10);
    else used = false;
    if (used) { e.preventDefault(); wake(); }
  });

  /* вкладки */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.tab === name;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    if (name === 'watch') setTimeout(() => urlEl.focus({ preventScroll: true }), 120);
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  document.querySelectorAll('.service').forEach(b => b.addEventListener('click', () => switchTab('watch')));

  /* настройки цвета */
  const ACCENTS = ['#8b7cff', '#4da3ff', '#2dd4bf', '#4ade80', '#ffb23f', '#ff6b9d', '#ff5a5a'];
  const BGS = ['#08080b', '#000000', '#0a0f1c', '#120b16'];
  const mix = (hex, to, a) => {
    const n = parseInt(hex.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255];
    return '#' + c.map(v => Math.round(v + (to - v) * a).toString(16).padStart(2, '0')).join('');
  };
  const rgbOf = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255].join(','); };
  let theme = Object.assign({ accent: ACCENTS[0], bg: BGS[0] }, store.get('player.theme', {}));
  const root = document.documentElement;
  const applyTheme = () => {
    const a = theme.accent;
    root.style.setProperty('--accent', a);
    root.style.setProperty('--accent-2', mix(a, 0, .2));
    root.style.setProperty('--accent-l', mix(a, 255, .28));
    root.style.setProperty('--ar', rgbOf(a));
    root.style.setProperty('--bg-2', theme.bg);
    root.style.setProperty('--bg', theme.bg);
    document.querySelectorAll('#accents .sw').forEach(s => s.classList.toggle('sel', s.dataset.c === a));
    $('custom').classList.toggle('sel', !ACCENTS.includes(a));
    document.querySelectorAll('#bgs .sw').forEach(s => s.classList.toggle('sel', s.dataset.c === theme.bg));
    store.set('player.theme', theme);
  };
  const mkSw = (c, cls, label) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw ' + cls; b.dataset.c = c; b.style.setProperty('--c', c);
    b.setAttribute('aria-label', label || c);
    return b;
  };
  ACCENTS.forEach(c => { const b = mkSw(c, ''); b.onclick = () => { theme.accent = c; applyTheme(); }; $('accents').appendChild(b); });
  const cu = document.createElement('label');
  cu.className = 'custom'; cu.id = 'custom'; cu.title = 'Свой цвет';
  cu.innerHTML = '<input type="color" aria-label="Свой цвет">';
  cu.firstChild.value = theme.accent;
  cu.firstChild.addEventListener('input', e => { theme.accent = e.target.value; applyTheme(); });
  $('accents').appendChild(cu);
  BGS.forEach(c => { const b = mkSw(c, 'bgsw'); b.onclick = () => { theme.bg = c; applyTheme(); }; $('bgs').appendChild(b); });
  $('reset').onclick = () => { theme = { accent: ACCENTS[0], bg: BGS[0] }; cu.firstChild.value = theme.accent; applyTheme(); };
  applyTheme();

  /* старт: ссылка из адреса или последняя */
  renderRecent();
  setHead('', '', false);
  const fromHash = (() => {
    const m = (location.hash || '').match(/^#v=(.+)$/);
    try { return m ? decodeURIComponent(m[1]) : null; } catch { return null; }
  })();
  if (fromHash) open(fromHash, { silent: true });
})();
</script>
</body>
</html>
